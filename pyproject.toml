[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neony"
version = "0.3.0.post1"
description = "Reactive desktop UI framework for Python — built on LumiView, a pythonic webview desktop app framework"
readme = "readme.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "HarcicYang" },
]
keywords = ["desktop", "gui", "webview", "reactive", "ui-framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "lumiview==0.1.0.dev5",
    "imageio-ffmpeg>=0.5.0",
    "pyclip>=0.7.0",
    "pydantic>=2.13.4",
]

[project.scripts]
gallery = "neony.gallery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neony*"]

[tool.setuptools.package-data]
neony = ["javascript/*.js", "assets/icons/*.woff2", "assets/icons/LICENSE.*", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# Chinese translations legitimately use full-width punctuation (，：（）) —
# RUF001's "ambiguous Unicode" rule is a false positive for real CJK text.
[tool.ruff.lint.per-file-ignores]
"src/neony/gallery/i18n.py" = ["RUF001"]
# core.py deliberately imports gallery/i18n before the other imports —
# registering the catalog must precede every tr_now() call in the module.
"src/neony/gallery/core.py" = ["I001"]

[tool.pyrefly]
preset = "strict"

[tool.pyrefly.errors]
bad-override-mutable-attribute = false
bad-override = false
implicit-any-type-argument = false
implicit-any-lambda = false
implicit-any-parameter = false
implicit-any-empty-container = false
missing-override-decorator = false


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "smoke: real-window demo startup, needs a display (run under xvfb-run)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pyrefly>=0.60.0",
]
