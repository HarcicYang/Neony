[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neony"
version = "0.1.1.dev1"
description = "Reactive desktop UI framework for Python — built on LumiView, a pythonic webview desktop app framework"
readme = "readme.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "HarcicYang" },
]
keywords = ["desktop", "gui", "webview", "reactive", "ui-framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "lumiview==0.1.0.dev4",
    "pyclip>=0.7.0",
    "pydantic>=2.13.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neony*"]

[tool.setuptools.package-data]
neony = ["javascript/*.js", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# [tool.ruff.lint.per-file-ignores]

[tool.pyrefly.errors]
bad-override-mutable-attribute = false


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "smoke: real-window demo startup, needs a display (run under xvfb-run)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pyrefly>=0.60.0",
]
