name: Packaging

# Build standalone executables of the gallery demo, one per platform.
# Triggered manually (workflow_dispatch) for test builds, or by a v* tag
# push (release) — not on every commit: PyInstaller x3 + Nuitka costs
# ~15 CI minutes per run, and ci.yml's smoke-demos job already catches
# demo breakage on every push.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  pyinstaller:
    name: pyinstaller-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 needs a lumiview macOS arm64 wheel; if the build
        # fails on the missing wheel, switch that entry to macos-13
        # (Intel) or wait for an arm64 wheel from upstream.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - run: uv sync --group dev
      - run: uv pip install pyinstaller

      - name: Build executable (PyInstaller)
        shell: bash
        run: |
          uv run pyinstaller \
            --onefile \
            --name neony-gallery \
            --collect-binaries lumiview \
            --collect-binaries wryview \
            --collect-data neony \
            --hidden-import lumiview.plugins.window_controls \
            --hidden-import lumiview._events \
            --hidden-import lumiview._task \
            demo_gallery.py

      - name: Write Linux runtime README
        if: runner.os == 'Linux'
        run: |
          cat > README-linux.md <<'EOF'
          # neony-gallery (Linux)

          This executable needs the WebKitGTK runtime to run:

            Ubuntu/Debian: sudo apt install libwebkit2gtk-4.1-0
            Fedora:        sudo dnf install webkit2gtk4.1
            Arch:          sudo pacman -S webkit2gtk-6.0

          All other dependencies are bundled. Windows and macOS builds
          are fully self-contained (WebView2 / WebKit are OS-provided).
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neony-gallery-${{ matrix.os }}
          path: |
            dist/neony-gallery*
            README-linux.md
          if-no-files-found: error

  # Experimental: verify Nuitka can bundle the same demo (Rust native
  # extensions + lazy imports). Linux only for now — Windows/macOS
  # follow once this proves out. Independent job: a failure here never
  # blocks the PyInstaller builds.
  nuitka-linux:
    name: nuitka-linux (experiment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - run: uv sync --group dev
      - run: uv pip install nuitka

      - name: Build executable (Nuitka)
        shell: bash
        run: |
          uv run python -m nuitka \
            --onefile \
            --include-package-data=neony \
            --include-module=lumiview._events \
            --include-module=lumiview._task \
            --include-module=lumiview.plugins.window_controls \
            demo_gallery.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neony-gallery-nuitka-linux
          path: demo_gallery.bin
          if-no-files-found: error

  # Tag pushes only: collect every platform's artifact and attach them
  # to the GitHub Release.
  release:
    name: attach-to-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pyinstaller, nuitka-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
