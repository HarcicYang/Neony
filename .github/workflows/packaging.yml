name: Packaging

# Build a standalone executable of the gallery demo with Nuitka, per
# platform.  Triggered manually (workflow_dispatch) for test builds, or
# by a v* tag push (release) — not on every commit: 3 builds cost ~10
# CI minutes per run, and ci.yml's smoke-demos job already catches demo
# breakage on every push.
#
# Artifact naming: <os>_<arch>_<version>_nuitka[.exe]
#   e.g. linux_x86_64_0.1.0_nuitka, win_x86_64_0.1.0_nuitka.exe
# Version comes from pyproject.toml (works for workflow_dispatch too).
#
# Wheel availability (verified against PyPI): lumiview + wryview publish
# linux x86_64, win_amd64, and macosx_11_0_arm64 — NO Intel mac wheels,
# so the macOS entries must stay on arm64 (macos-latest); macos-13 would
# fail at dependency resolution.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  nuitka:
    name: nuitka-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux_x86_64
          - os: windows-latest
            label: win_x86_64
          - os: macos-latest
            label: macos_arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - run: uv sync --group dev
      # Nuitka[onefile] pulls in zstandard — without it the onefile
      # payload is stored uncompressed (Linux was 48 MB vs 13 MB on
      # win/mac, whose runners happen to ship zstandard).
      - run: uv pip install "nuitka[onefile]"

      # The entry is the gallery package's __main__ module; the rest of the
      # package (and neony, with its JS assets) is pulled in via the script's
      # --include-package / --include-package-data flags.  The script also
      # renames the artifact to neony-gallery_<os>_<arch>_<version>_nuitka[.exe]
      # (uv sync and the Nuitka[onefile] install happened above → --no-install).
      - name: Build executable (Nuitka)
        shell: bash
        run: uv run python scripts/build_nuitka.py --no-install

      - name: Write Linux runtime README
        if: runner.os == 'Linux'
        run: |
          cat > README-linux.md <<'EOF'
          # neony-gallery (Linux)

          This executable needs the WebKitGTK runtime to run:

            Ubuntu/Debian: sudo apt install libwebkit2gtk-4.1-0
            Fedora:        sudo dnf install webkit2gtk4.1
            Arch:          sudo pacman -S webkit2gtk-6.0

          All other dependencies are bundled. Windows and macOS builds
          are fully self-contained (WebView2 / WebKit are OS-provided).
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neony-gallery_${{ matrix.label }}_nuitka
          path: |
            neony-gallery_*
            README-linux.md
          if-no-files-found: error

  # Tag pushes only: collect every platform's artifact and attach them
  # to the GitHub Release.
  release:
    name: attach-to-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nuitka]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
