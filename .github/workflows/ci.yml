name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: uv sync --group dev
      # Everything ruff / pyrefly / pytest / vitest in one pass.
      # scripts/check_all.py exits non-zero on any failure (including a
      # missing executable — see run_check's FileNotFoundError handling),
      # so a broken check fails the job.  The JS install (npm ci) is
      # bootstrapped inside the script when node_modules is absent, which
      # is the case on a clean checkout.
      - name: Run full check suite
        run: uv run python scripts/check_all.py

  smoke-demos:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev xvfb

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - run: uv sync --group dev
      - run: xvfb-run --auto-servernum uv run pytest tests/smoke_demos.py -v -m smoke
